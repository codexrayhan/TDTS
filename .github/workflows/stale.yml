name: Mark stale issues and PRs

on:
  schedule:
    - cron: "30 1 * * *"

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            This issue has been inactive for 30 days. Marking as stale.
            Comment within 7 days to keep it open, otherwise it will be closed.
          stale-pr-message: |
            This PR has been inactive for 30 days. Marking as stale.
            Comment within 7 days to keep it open, otherwise it will be closed.
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          days-before-stale: 30
          days-before-close: 7
          exempt-issue-labels: "pinned,security,roadmap"
          exempt-pr-labels: "pinned,security"
